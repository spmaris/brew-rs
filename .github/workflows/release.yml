name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v0.1.0)
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (Apple Silicon)
    runs-on: macos-15
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - name: Verify release tag and runner
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a version tag such as v0.1.0.' >&2
            exit 1
          fi
          test "$(uname -m)" = arm64

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Run release checks
        run: |
          cargo fetch --locked
          sh scripts/verify.sh

      - name: Package and verify executable
        shell: bash
        run: |
          asset="brewrs-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
          expected="brewrs ${RELEASE_TAG#v}"
          test "$(target/release/brewrs --version)" = "$expected"
          /usr/bin/codesign --verify target/release/brewrs
          mkdir -p target/release-assets
          archive="$PWD/target/release-assets/$asset"
          stage=$(mktemp -d)
          /usr/bin/install -m 0755 target/release/brewrs "$stage/brewrs"
          /usr/bin/install -m 0644 LICENSE "$stage/LICENSE"
          COPYFILE_DISABLE=1 /usr/bin/tar -czf "$archive" -C "$stage" brewrs LICENSE
          check=$(mktemp -d)
          /usr/bin/tar -xzf "$archive" -C "$check"
          test "$("$check/brewrs" --version)" = "$expected"
          cd target/release-assets
          /usr/bin/shasum -a 256 "$asset" > "$asset.sha256"
          /usr/bin/shasum -a 256 -c "$asset.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-silicon-release
          path: target/release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: apple-silicon-release
          path: release-assets

      - name: Publish verified archive and checksum
        working-directory: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset="brewrs-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
          sha256sum -c "$asset.sha256"
          if [[ "$RELEASE_TAG" == v0.1.0 ]]; then
            notes=$(printf '%s\n' \
              'First release of brewrs, a native Rust package manager for macOS. No Homebrew installation required.' \
              '' \
              '- Install supported formulae, casks, and declarative tap packages into a separate prefix, with SHA-256 verification.' \
              '- Preview changes, preserve pinned dependencies during upgrades, and audit an existing Homebrew install.' \
              '- Download includes the Apple Silicon CLI and MIT license; the SHA-256 checksum is a separate asset.')
            release_notes=(--notes "$notes")
          else
            release_notes=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "brewrs $RELEASE_TAG" \
            "${release_notes[@]}" "$asset" "$asset.sha256"
