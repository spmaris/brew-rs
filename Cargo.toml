[package]
name = "brew-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Spyros Maris <spyrosmaris@gmail.com>"]
description = "A native macOS package manager using Homebrew repositories and verified bottles"
license = "MIT"
homepage = "https://github.com/spmaris/brew-rs"
repository = "https://github.com/spmaris/brew-rs"
keywords = ["package-manager", "homebrew", "macos", "cli"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/.dsh-tui"]

[dependencies]
# CLI framework
clap = { version = "4.6.9", features = ["derive", "color"] }

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }

# HTTP client
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-no-alpn", "charset", "system-proxy", "json", "stream", "gzip"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
url = "2.5.9"

# Error handling
anyhow = "1.0.105"

# Terminal UI
colored = "3.1.1"
indicatif = "0.18.6"
console = "0.16.6"
ratatui = { version = "0.30.2", default-features = false }

# File operations
tar = "0.4.46"
flate2 = "1.1.11"
tempfile = "3.27.0"

# Fuzzy search
fuzzy-matcher = "0.3.7"

# System paths
dirs = "7.0.0"

# Cryptography
sha2 = "0.11.1"
hex = "0.4.3"

# Logging
log = "0.4.35"
env_logger = "0.11.12"

[[bin]]
name = "brewrs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
