[package]
name = "brew-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Spyros Maris <spyrosmaris@gmail.com>"]
description = "A fast command line for Homebrew with cache-first search and readable package tables"
license = "MIT"
homepage = "https://github.com/spmaris/brew-rs"
repository = "https://github.com/spmaris/brew-rs"
keywords = ["package-manager", "homebrew", "macos", "cli"]
categories = ["command-line-utilities"]

[dependencies]
# CLI framework
clap = { version = "4.0", features = ["derive", "color"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Terminal UI
colored = "2.0"
indicatif = "0.17"
console = "0.15"

# File operations
tar = "0.4"
flate2 = "1.0"
walkdir = "2.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Fuzzy search
fuzzy-matcher = "0.3"

# System paths
dirs = "5.0"

# Cryptography
sha2 = "0.10"
hex = "0.4"

# Logging
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "brewrs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]